      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  minLength: 1
                mimeType:
                  type: string
                  enum: &ref_8
                    - application/pdf
                    - image/jpeg
                    - image/png
              required:
                - filename
                - mimeType
      responses:
        '200':
          description: Presigned POST envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /users/me/tickets/{ticketId}/upload-confirm:
    post:
      tags:
        - tickets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                s3_key:
                  type: string
                  minLength: 1
                filename:
                  type: string
                  minLength: 1
                mimeType:
                  type: string
                  enum: *ref_8
              required:
                - s3_key
                - filename
                - mimeType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadConfirmResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /users/me/tickets/route-lookup:
    post:
      tags:
        - tickets
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fromStation:
                  type: string
                fromEva:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                toStation:
                  type: string
                toEva:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                date:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                timeWindow:
                  type: object
                  properties:
                    from:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    to:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  required:
                    - from
                    - to
              required:
                - date
      responses:
        '200':
          description: Candidate connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteLookupResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /users/me/tickets/from-route:
    post:
      tags:
        - tickets
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketId:
                  type: string
                  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                trainNr:
                  type: string
                  minLength: 1
                date:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                fromStation:
                  type: string
                  minLength: 1
                toStation:
                  type: string
                  minLength: 1
                abfahrtszeit_plan:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d$
                ankunftszeit_plan:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d$
                fahrkartennummer:
                  type: string
                  minLength: 1
                fahrkartenpreis:
                  type: string
                  pattern: ^-?[0-9]+\.[0-9]{2}$
                is_zeitkarte:
                  type: boolean
                  default: false
                templateId:
                  type: string
                  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
              required:
                - trainNr
                - date
                - fromStation
                - toStation
                - abfahrtszeit_plan
                - ankunftszeit_plan
                - fahrkartennummer
                - fahrkartenpreis
      responses:
        '201':
          description: MANUAL_ROUTE ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketId:
                    type: string
                    pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                  ticket_state:
                    type: string
                    enum:
                      - READY
                  extraction_method:
                    type: string
                    enum:
                      - MANUAL_ROUTE
                  extraction_confidence:
                    type: number
                    enum:
                      - 0
                required:
                  - ticketId
                  - ticket_state
                  - extraction_method
                  - extraction_confidence
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /users/me/tickets/{ticketId}/delays:
    post:
      tags:
        - tickets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trainNr:
                  type: string
                  minLength: 1
                date:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                abreisebahnhof:
                  type: string
                  minLength: 1
                zielbahnhof:
                  type: string
                  minLength: 1
              required:
                - trainNr
                - date
                - abreisebahnhof
                - zielbahnhof
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  trainNr:
                    type: string
                  date:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  segments:
                    type: array
                    items:
                      type: object
                      properties:
                        segId:
                          type: string
                        origin:
                          type: string
                        destination:
                          type: string
                        delayMinutes:
                          type: integer
                          minimum: 0
                        reason:
                          type: string
                        is_cancelled:
                          type: boolean
                        abfahrtszeit_plan:
                          type: string
                          pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        abfahrtszeit_tatsaechlich:
                          type: string
                          pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        ankunftszeit_plan:
                          type: string
                          pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        ankunftszeit_tatsaechlich:
                          type: string
                          pattern: ^([01]\d|2[0-3]):[0-5]\d$
                      required:
                        - segId
                        - origin
                        - destination
                        - delayMinutes
                        - reason
                        - is_cancelled
                        - abfahrtszeit_plan
                        - ankunftszeit_plan
                  maxDelayMinutes:
                    type: integer
                    minimum: 0
                  any_cancelled:
                    type: boolean
                  suggested_antragsart:
                    type: string
                    enum: *ref_1
                  data_quality:
                    type: string
                    enum: &ref_10
                      - FULL
                      - PARTIAL
                      - PLAN_ONLY
                required:
                  - trainNr
                  - date
                  - segments
                  - maxDelayMinutes
                  - any_cancelled
                  - suggested_antragsart
                  - data_quality
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /users/me/tickets/{ticketId}/refund:
    post:
      tags:
        - tickets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '200':
          description: Refund submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /users/me/tickets/{ticketId}/belege:
    post:
      tags:
        - belege
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TicketIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  minLength: 1
                mimeType:
                  type: string
                  enum: *ref_8
                typ:
                  type: string
                  enum: &ref_9
                    - TAXI
                    - BUS
                    - HOTEL
                    - SONSTIGES
              required:
                - filename
                - mimeType
