openapi: 3.0.3
info:
  title: RailBack API
  version: 0.1.0
  description: >-
    OpenAPI contract for the RailBack backend. Generated from zod schemas via @asteasolutions/zod-to-openapi. Commit
    this file — CI drift-checks it.
servers:
  - url: https://{apiId}.execute-api.eu-north-1.amazonaws.com
    description: API Gateway HTTP API base. Replace {apiId} with the deployed API's id; region is eu-north-1.
    variables:
      apiId:
        default: example
        description: API Gateway HTTP API id
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TicketIdParam:
      type: string
      example: 01H...
    BelegIdParam:
      type: string
    TemplateIdParam:
      type: string
    EmailParam:
      type: string
    TrainNrParam:
      type: string
    DateParam:
      type: string
    BatchIdParam:
      type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        user:
          type: object
          properties:
            email:
              type: string
            vorname:
              type: string
            nachname:
              type: string
            role:
              type: string
              enum:
                - USER
                - ADMIN
          required:
            - email
            - vorname
            - nachname
            - role
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
      description: Shared response for /auth/register, /auth/login, /auth/refresh.
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                nullable: true
          required:
            - code
            - message
      required:
        - error
      description: Uniform error envelope. `error.code` is one of ERROR_CODES; `error.details` is an opaque bag.
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 256
        vorname:
          type: string
          minLength: 1
          maxLength: 100
        nachname:
          type: string
          minLength: 1
          maxLength: 100
        telefon:
          type: string
          minLength: 1
          maxLength: 40
        adresse:
          type: object
          properties:
            strasse:
              type: string
              minLength: 1
              maxLength: 200
            hausnr:
              type: string
              minLength: 1
              maxLength: 20
            plz:
              type: string
              minLength: 1
              maxLength: 20
            ort:
              type: string
              minLength: 1
              maxLength: 200
            land:
              type: string
              minLength: 1
              maxLength: 80
          required:
            - strasse
            - hausnr
            - plz
            - ort
            - land
        iban:
          type: string
        bic:
          type: string
        datenschutz_einwilligung:
          type: boolean
          enum:
            - true
        agb_akzeptiert:
          type: boolean
          enum:
            - true
      required:
        - email
        - password
        - vorname
        - nachname
        - telefon
        - adresse
        - iban
        - bic
        - datenschutz_einwilligung
        - agb_akzeptiert
      description: POST /auth/register body. IBAN/BIC required at registration.
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - email
        - password
      description: POST /auth/login body.
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
      description: POST /auth/refresh body.
    GetUserResponse:
      type: object
      properties:
        email:
          type: string
        vorname:
          type: string
        nachname:
          type: string
        telefon:
          type: string
        adresse:
          type: object
          properties:
            strasse:
              type: string
              minLength: 1
              maxLength: 200
            hausnr:
              type: string
              minLength: 1
              maxLength: 20
            plz:
              type: string
              minLength: 1
              maxLength: 20
            ort:
              type: string
              minLength: 1
              maxLength: 200
            land:
              type: string
              minLength: 1
              maxLength: 80
          required:
            - strasse
            - hausnr
            - plz
            - ort
            - land
        user_state:
          type: string
          enum: &ref_6
            - ACTIVE
            - SUSPENDED
            - DELETION_SCHEDULED
        created_at:
          type: string
          format: date-time
      required:
        - email
        - vorname
        - nachname
        - telefon
        - adresse
        - user_state
        - created_at
      description: GET /users/me — general profile view. Never carries IBAN/BIC.
    RefundDataResponse:
      type: object
      properties:
        vorname:
          type: string
        nachname:
          type: string
        email:
          type: string
        telefon:
          type: string
        adresse:
          type: object
          properties:
            strasse:
              type: string
              minLength: 1
              maxLength: 200
            hausnr:
              type: string
              minLength: 1
              maxLength: 20
            plz:
              type: string
              minLength: 1
              maxLength: 20
            ort:
              type: string
              minLength: 1
              maxLength: 200
            land:
              type: string
              minLength: 1
              maxLength: 80
          required:
            - strasse
            - hausnr
            - plz
            - ort
            - land
        iban:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
      required:
        - vorname
        - nachname
        - email
        - telefon
        - adresse
        - iban
        - bic
      description: GET /users/me/refund-data — field-set the EU-form needs; includes IBAN/BIC.
    TicketSummary:
      type: object
      properties:
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        ticket_state:
          type: string
          enum: &ref_0
            - VALIDATING
            - READY
            - EMAIL_SENDING
            - PENDING_DB_PAYMENT
            - APPROVED
            - REJECTED
            - COMPLETED
            - EMAIL_FAILED
            - INVALID
        abreisedatum:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        abreisebahnhof:
          type: string
        zielbahnhof:
          type: string
        fahrkartenpreis:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        antragsart:
          type: string
          enum: &ref_1
            - ERSTATTUNG_FAHRKARTE
            - ENTSCHAEDIGUNG_60_119
            - ENTSCHAEDIGUNG_120_PLUS
            - ENTSCHAEDIGUNG_ZEITKARTE
            - KOSTEN_ALTERNATIVTRANSPORT
        erwartete_erstattung:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        email_status:
          type: string
          enum: &ref_2
            - SENDING
            - SENT
            - FAILED_TRANSIENT
            - DELIVERED
            - BOUNCED
            - FAILED
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - ticketId
        - ticket_state
        - updated_at
      description: Dashboard list-item projection of a ticket.
    ListTicketsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
      required:
        - items
      description: GET /users/me/tickets — user-scoped ticket list.
    TicketResponse:
      type: object
      properties:
        email:
          type: string
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        ticket_state:
          type: string
          enum: *ref_0
        state_timeline:
          type: array
          items:
            type: object
            properties:
              state:
                type: string
                enum: *ref_0
              at:
                type: string
                format: date-time
            required:
              - state
              - at
        extraction_status:
          type: string
          enum: &ref_3
            - PROCESSING
            - DONE
            - FAILED
        extraction_method:
          type: string
          enum: &ref_7
            - BARCODE
            - PDF_TEXT
            - MANUAL
            - MANUAL_ROUTE
        extraction_confidence:
          type: number
        barcode_uid:
          type: string
        vorname_aus_ticket:
          type: string
        nachname_aus_ticket:
          type: string
        fahrt_abreisedatum:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        fahrt_abreisebahnhof:
          type: string
        fahrt_zielbahnhof:
          type: string
        fahrt_abfahrtszeit_plan:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        fahrt_ankunftszeit_plan:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        fahrt_zugnummer_plan:
          type: string
        fahrt_zugkategorie_plan:
          type: string
        fahrt_fahrkartennummer:
          type: string
        fahrt_fahrkartenpreis:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        tatsaechlich_ankunftsdatum:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        tatsaechlich_abfahrtszeit:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        tatsaechlich_ankunftszeit:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        tatsaechlich_zugnummer:
          type: string
        tatsaechlich_verpasster_anschluss_bahnhof:
          type: string
        antragsgrund:
          type: array
          items:
            type: string
            enum: &ref_4
              - VERSPAETUNG
              - AUSFALL
              - VERPASSTER_ANSCHLUSS
        antragsart:
          type: string
          enum: *ref_1
        is_zeitkarte:
          type: boolean
        antragstellung_ort:
          type: string
        antragstellung_datum:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        zusaetzliche_angaben:
          type: string
        datenschutz_einwilligung:
          type: boolean
        wahrheitserklaerung:
          type: boolean
        delayMinutes:
          type: integer
          minimum: 0
        erwartete_erstattung:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        service_fee_betrag:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        db_paid_at:
          type: string
          format: date-time
        admin_note:
          type: string
        email_status:
          type: string
          enum: *ref_2
        email_attempts:
          type: integer
          minimum: 0
        email_last_attempt:
          type: string
          format: date-time
        email_failed_reason:
          type: string
        uploaded_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        belege_count:
          type: integer
          minimum: 0
      required:
        - email
        - ticketId
        - ticket_state
        - state_timeline
        - extraction_status
        - extraction_method
        - extraction_confidence
        - updated_at
      description: >-
        Full ticket view. Never includes iban/bic. Optional fields fill in as the ticket progresses through the state
        machine.
    UploadResponse:
      type: object
      properties:
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        uploadUrl:
          type: string
          format: uri
        s3_key:
          type: string
          minLength: 1
        expiresIn:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        fields:
          type: object
          additionalProperties:
            type: string
      required:
        - ticketId
        - uploadUrl
        - s3_key
        - expiresIn
        - fields
      description: Presigned S3 POST envelope for a raw ticket upload.
    UploadConfirmResponse:
      type: object
      properties:
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        extraction_status:
          type: string
          enum: *ref_3
      required:
        - ticketId
        - extraction_status
      description: Response after landing the RAW#<ticketId> DDB row.
    RouteLookupResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            type: object
            properties:
              trainNr:
                type: string
              zugkategorie:
                type: string
              abfahrt_plan:
                type: string
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
              ankunft_plan:
                type: string
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
              abfahrt_tatsaechlich:
                type: string
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
              ankunft_tatsaechlich:
                type: string
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
              delayMinutes:
                type: integer
                minimum: 0
              any_cancelled:
                type: boolean
              data_quality:
                type: string
                enum:
                  - FULL
                  - PARTIAL
                  - PLAN_ONLY
            required:
              - trainNr
              - abfahrt_plan
              - ankunft_plan
              - delayMinutes
              - any_cancelled
              - data_quality
      required:
        - candidates
      description: Candidate direct connections for the MANUAL_ROUTE flow.
    RefundResponse:
      type: object
      properties:
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        ticket_state:
          type: string
          enum:
            - EMAIL_SENDING
            - EMAIL_FAILED
        submitted_at:
          type: string
          format: date-time
        email_status:
          type: string
          enum: *ref_2
        erwartete_erstattung:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        service_fee_betrag:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
      required:
        - ticketId
        - ticket_state
        - submitted_at
        - email_status
        - erwartete_erstattung
        - service_fee_betrag
      description: POST /refund response. Amounts are locked at submit; edits require reject + resubmit.
    RefundRequest:
      type: object
      properties:
        antragsgrund:
          type: array
          items:
            type: string
            enum: *ref_4
          minItems: 1
        antragsart:
          type: string
          enum: *ref_1
        is_zeitkarte:
          type: boolean
        fahrt:
          type: object
          properties:
            abreisedatum:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
            abreisebahnhof:
              type: string
              minLength: 1
            zielbahnhof:
              type: string
              minLength: 1
            abfahrtszeit_plan:
              type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            ankunftszeit_plan:
              type: string
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            zugnummer_plan:
              type: string
              minLength: 1
            zugkategorie_plan:
              type: string
            fahrkartennummer:
              type: string
              minLength: 1
            fahrkartenpreis:
              type: string
              pattern: ^-?[0-9]+\.[0-9]{2}$
          required:
            - abreisedatum
            - abreisebahnhof
            - zielbahnhof
            - abfahrtszeit_plan
            - ankunftszeit_plan
            - zugnummer_plan
            - fahrkartennummer
            - fahrkartenpreis
        fahrt_tatsaechlich:
          type: object
          properties:
            ankunftsdatum_tatsaechlich:
              type: string
              nullable: true
              pattern: ^\d{4}-\d{2}-\d{2}$
            abfahrtszeit_tatsaechlich:
              type: string
              nullable: true
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            ankunftszeit_tatsaechlich:
              type: string
              nullable: true
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            zugnummer_tatsaechlich:
              type: string
              nullable: true
            verpasster_anschluss_bahnhof:
              type: string
              nullable: true
        antragstellung_ort:
          type: string
          minLength: 1
        zusaetzliche_angaben:
          type: string
        datenschutz_einwilligung:
          type: boolean
          enum:
            - true
        wahrheitserklaerung:
          type: boolean
          enum:
            - true
      required:
        - antragsgrund
        - antragsart
        - fahrt
        - fahrt_tatsaechlich
        - antragstellung_ort
        - datenschutz_einwilligung
        - wahrheitserklaerung
      description: POST /users/me/tickets/{ticketId}/refund body. Section-5 contact info is NOT in this body.
    RouteTemplate:
      type: object
      properties:
        templateId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        label:
          type: string
          minLength: 1
        fromStation:
          type: string
          minLength: 1
        fromEva:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        toStation:
          type: string
          minLength: 1
        toEva:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        fahrkartennummer:
          type: string
        fahrkartenpreis:
          type: string
        zugkategorie_pref:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - templateId
        - label
        - fromStation
        - fromEva
        - toStation
        - toEva
        - created_at
        - updated_at
      description: Saved A→B route for the MANUAL_ROUTE-ticket flow. No cap, no TTL.
    ListRouteTemplatesResponse:
      type: object
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/RouteTemplate'
      required:
        - templates
      description: GET /users/me/route-templates.
    AdminStatsResponse:
      type: object
      properties:
        users:
          type: object
          properties:
            total:
              type: integer
              minimum: 0
            active:
              type: integer
              minimum: 0
            suspended:
              type: integer
              minimum: 0
            deletion_scheduled:
              type: integer
              minimum: 0
          required:
            - total
            - active
            - suspended
            - deletion_scheduled
        tickets:
          type: object
          properties:
            total:
              type: integer
              minimum: 0
            by_state:
              type: object
              properties:
                VALIDATING: &ref_5
                  type: integer
                  minimum: 0
                READY: *ref_5
                EMAIL_SENDING: *ref_5
                PENDING_DB_PAYMENT: *ref_5
                APPROVED: *ref_5
                REJECTED: *ref_5
                COMPLETED: *ref_5
                EMAIL_FAILED: *ref_5
                INVALID: *ref_5
            pending:
              type: integer
              minimum: 0
          required:
            - total
            - by_state
            - pending
        refunds:
          type: object
          properties:
            total_paid_out:
              type: string
              pattern: ^-?[0-9]+\.[0-9]{2}$
            currency:
              type: string
              enum:
                - EUR
            this_month_paid_out:
              type: string
              pattern: ^-?[0-9]+\.[0-9]{2}$
          required:
            - total_paid_out
            - currency
            - this_month_paid_out
        as_of:
          type: string
          format: date-time
      required:
        - users
        - tickets
        - refunds
        - as_of
      description: GET /admin/stats — KPI snapshot; frontend polls ≥ 30 s.
    AdminUserSummary:
      type: object
      properties:
        email:
          type: string
        vorname:
          type: string
        nachname:
          type: string
        telefon:
          type: string
        adresse:
          type: object
          properties:
            strasse:
              type: string
              minLength: 1
              maxLength: 200
            hausnr:
              type: string
              minLength: 1
              maxLength: 20
            plz:
              type: string
              minLength: 1
              maxLength: 20
            ort:
              type: string
              minLength: 1
              maxLength: 200
            land:
              type: string
              minLength: 1
              maxLength: 80
          required:
            - strasse
            - hausnr
            - plz
            - ort
            - land
        user_state:
          type: string
          enum: *ref_6
        suspended_at:
          type: string
          format: date-time
        suspended_reason:
          type: string
        created_at:
          type: string
          format: date-time
        ticket_count:
          type: integer
          minimum: 0
        total_refunded:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        iban:
          type: string
          nullable: true
        bic:
          type: string
          nullable: true
      required:
        - email
        - vorname
        - nachname
        - telefon
        - adresse
        - user_state
        - created_at
        - ticket_count
        - total_refunded
      description: Admin user-list projection. Carries plaintext iban/bic (or null).
    ListUsersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        nextCursor:
          type: string
      required:
        - items
      description: GET /admin/users.
    GetAdminUserResponse:
      allOf:
        - $ref: '#/components/schemas/AdminUserSummary'
        - type: object
          properties:
            recent_tickets:
              type: array
              items:
                type: object
                properties:
                  ticketId:
                    type: string
                    pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                  ticket_state:
                    type: string
                    enum: *ref_0
                  abreisedatum:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  erwartete_erstattung:
                    type: string
                    pattern: ^-?[0-9]+\.[0-9]{2}$
                required:
                  - ticketId
                  - ticket_state
          required:
            - recent_tickets
      description: GET /admin/users/{email} — user detail with recent tickets.
    AdminTicketSummary:
      type: object
      properties:
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        email:
          type: string
        vorname:
          type: string
        nachname:
          type: string
        ticket_state:
          type: string
          enum: *ref_0
        antragsart:
          type: string
          enum: *ref_1
        antragsgrund:
          type: array
          items:
            type: string
            enum: *ref_4
        abreisedatum:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        abreisebahnhof:
          type: string
        zielbahnhof:
          type: string
        zugnummer_plan:
          type: string
        fahrkartenpreis:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        erwartete_erstattung:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        delayMinutes:
          type: integer
          minimum: 0
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - ticketId
        - email
        - vorname
        - nachname
        - ticket_state
        - updated_at
      description: Admin ticket-list projection (unprefixed wire names).
    AdminListTicketsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminTicketSummary'
        nextCursor:
          type: string
      required:
        - items
      description: GET /admin/tickets — admin ticket list.
    GetAdminTicketResponse:
      type: object
      properties:
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        email:
          type: string
        vorname:
          type: string
        nachname:
          type: string
        ticket_state:
          type: string
          enum: *ref_0
        state_timeline:
          type: array
          items:
            type: object
            properties:
              state:
                type: string
                enum: *ref_0
              at:
                type: string
                format: date-time
            required:
              - state
              - at
        extraction_method:
          type: string
          enum: *ref_7
        extraction_confidence:
          type: number
        barcode_uid:
          type: string
        fahrt_abreisedatum:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        fahrt_abreisebahnhof:
          type: string
        fahrt_zielbahnhof:
          type: string
        fahrt_abfahrtszeit_plan:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        fahrt_ankunftszeit_plan:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        fahrt_zugnummer_plan:
          type: string
        fahrt_zugkategorie_plan:
          type: string
        fahrt_fahrkartennummer:
          type: string
        fahrt_fahrkartenpreis:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        tatsaechlich_ankunftsdatum:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        tatsaechlich_abfahrtszeit:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        tatsaechlich_ankunftszeit:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
        tatsaechlich_zugnummer:
          type: string
        tatsaechlich_verpasster_anschluss_bahnhof:
          type: string
        antragsgrund:
          type: array
          items:
            type: string
            enum: *ref_4
        antragsart:
          type: string
          enum: *ref_1
        antragstellung_ort:
          type: string
        zusaetzliche_angaben:
          type: string
        delayMinutes:
          type: integer
          minimum: 0
        erwartete_erstattung:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        service_fee_betrag:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        has_belege:
          type: boolean
        db_paid_at:
          type: string
          format: date-time
        admin_note:
          type: string
        email_status:
          type: string
          enum: *ref_2
        email_provider_id:
          type: string
        email_failed_reason:
          type: string
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sepa_mandate:
          type: object
          properties:
            state:
              type: string
              enum:
                - ISSUED
                - SUBMITTED
                - DEBITED
                - REVERSED
                - DISPUTED
                - EXPIRED
                - CANCELLED
            debited_at:
              type: string
              format: date-time
            reversed_at:
              type: string
              format: date-time
            reversed_reason:
              type: string
            dispute_opened_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time
          required:
            - state
            - expires_at
      required:
        - ticketId
        - email
        - ticket_state
        - state_timeline
        - extraction_method
        - extraction_confidence
        - has_belege
      description: GET /admin/tickets/{ticketId} — full admin view; iban/bic never present.
    GetPendingBatchesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              batchId:
                type: string
              s3_key:
                type: string
              downloadUrl:
                type: string
                format: uri
              downloadUrlExpiresIn:
                type: integer
                minimum: 0
                exclusiveMinimum: true
              mandate_count:
                type: integer
                minimum: 0
              total_eur:
                type: string
                pattern: ^-?[0-9]+\.[0-9]{2}$
              built_at:
                type: string
                format: date-time
            required:
              - batchId
              - s3_key
              - downloadUrl
              - downloadUrlExpiresIn
              - mandate_count
              - total_eur
              - built_at
      required:
        - items
      description: GET /admin/sepa/pending-batches — SEPA batches awaiting bank upload.
    MarkSubmittedResponse:
      type: object
      properties:
        batchId:
          type: string
        submitted_at:
          type: string
          format: date-time
        mandates_marked:
          type: integer
          minimum: 0
      required:
        - batchId
        - submitted_at
        - mandates_marked
      description: POST /admin/sepa/batches/{batchId}/mark-submitted response.
    SepaReportUploadResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
        fields:
          type: object
          additionalProperties:
            type: string
        expires_in:
          type: integer
          minimum: 0
          exclusiveMinimum: true
      required:
        - url
        - fields
        - expires_in
      description: POST /admin/sepa/reports/upload — presigned POST envelope.
  parameters:
    TicketIdParam:
      schema:
        $ref: '#/components/schemas/TicketIdParam'
