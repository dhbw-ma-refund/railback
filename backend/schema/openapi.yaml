paths:
  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new user (lands in ACTIVE).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /auth/login:
    post:
      tags:
        - auth
      summary: Log in. Same endpoint for users and admins; role in JWT claim.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Suspended or deletion-scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Rotate refresh token; issue new access token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Suspended or deletion-scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /users/me:
    get:
      tags:
        - users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vorname:
                  type: string
                  minLength: 1
                  maxLength: 100
                nachname:
                  type: string
                  minLength: 1
                  maxLength: 100
                telefon:
                  type: string
                  minLength: 1
                  maxLength: 40
                adresse:
                  type: object
                  properties:
                    strasse:
                      type: string
                      minLength: 1
                      maxLength: 200
                    hausnr:
                      type: string
                      minLength: 1
                      maxLength: 20
                    plz:
                      type: string
                      minLength: 1
                      maxLength: 20
                    ort:
                      type: string
                      minLength: 1
                      maxLength: 200
                    land:
                      type: string
                      minLength: 1
                      maxLength: 80
                  required:
                    - strasse
                    - hausnr
                    - plz
                    - ort
                    - land
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmPassword:
                  type: string
                  minLength: 1
                  maxLength: 256
              required:
                - confirmPassword
      responses:
        '204':
          description: Scheduled for deletion
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /users/me/refund-data:
    get:
