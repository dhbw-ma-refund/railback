[project]
name = "railback-ticket-extractor"
version = "0.1.0"
description = "Decodes DB tickets — Aztec barcode → PDF text → MANUAL cascade"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.7",
    "zxing-cpp>=2.2",     # Aztec / barcode decoder
    "pymupdf>=1.24",      # PDF text-layer
    "pillow>=10.0",       # image normalisation for non-PDF uploads
    "pycryptodome>=3.20", # required by vendored onlineticket.py (signature verification optional but available)
    "pyasn1>=0.6",        # required by vendored onlineticket.py
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "moto[s3,dynamodb]>=5",  # AWS mocks for tests
]

# This is a Lambda zip, not a library — no build-system block.
# uv treats the project as a "uv-managed app" and skips the
# setuptools/wheel dance. Source layout is declared so `uv sync` knows
# which files to install. See BUILD.md for the zip-deploy steps.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["*_spec.py"]
addopts = "-ra --strict-markers"
